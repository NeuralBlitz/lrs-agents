# NeuralBlitz v50 API and observability stack.
# TLS termination is expected at an external ingress/load balancer; this stack
# intentionally does not mount or ship a repository-managed private key.

services:
  neuralblitz-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuralblitz-api
    environment:
      FLASK_ENV: production
      FLASK_PORT: "5000"
      PYTHONPATH: /app
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the deployment environment}"
      ENABLE_DEMO_AUTH: "false"
      NEURALBLITZ_DEMO_USERS_JSON: "${NEURALBLITZ_DEMO_USERS_JSON:-}"
      LOG_LEVEL: info
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      NB_WORKERS: "${NB_WORKERS:-4}"
      NB_THREADS: "${NB_THREADS:-4}"
      NB_MAX_REQUESTS: "${NB_MAX_REQUESTS:-1000}"
      NB_TIMEOUT: "${NB_TIMEOUT:-120}"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    networks:
      - neuralblitz-network
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

  prometheus:
    image: prom/prometheus:latest
    container_name: neuralblitz-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus:rw
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.min-block-duration=2h"
      - "--storage.tsdb.max-block-duration=2h"
    restart: unless-stopped
    networks:
      - neuralblitz-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: neuralblitz-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD when enabling monitoring}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:rw
      - ./grafana/data:/var/lib/grafana:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - neuralblitz-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  nginx:
    image: nginx:alpine
    container_name: neuralblitz-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - neuralblitz-network
    depends_on:
      neuralblitz-api:
        condition: service_healthy

networks:
  neuralblitz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  logs:
    driver: local
  data:
    driver: local
