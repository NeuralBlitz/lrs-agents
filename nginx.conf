events {
    worker_connections 1024;
}

http {
    upstream neuralblitz_api {
        server neuralblitz-api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            proxy_pass http://neuralblitz_api/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus scrapes the API directly over the private Docker network.
        # Do not expose operational metrics through the public reverse proxy.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://neuralblitz_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
        }
    }
}
